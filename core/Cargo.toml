[package]
name = "embedded-debugger"
version = "0.2.0"
edition = "2021"
description = "嵌入式调试器核心库（probe-rs 调试 / DWARF 解析 / CMSIS-Pack 导入）"

[lib]
name = "embedded_debugger_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
probe-rs = "0.32"
probe-rs-target = "0.32"
target-gen = "0.32"
capstone = "0.14"
gimli = "0.34"
object = "0.39"
